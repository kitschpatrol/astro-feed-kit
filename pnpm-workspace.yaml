ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/chagent@0.5.0'
packageExtensions:
  # Remove once @astrojs/astro2tsx declares the @emnapi/runtime matching its pinned @emnapi/core.
  # https://github.com/withastro/astro/issues/18653
  # https://github.com/withastro/compiler-rs/pull/219
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
packages:
  - .
  - playground
  - playground-i18n
  - playground-starlight
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  tsdown:
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
